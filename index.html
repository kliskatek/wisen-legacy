<body>

<!-- Todo va dentro de un escenario 16:9 que se encaja en cualquier pantalla; las medidas, en cqw/cqh del escenario -->
<main id="escenario">
  <header class="barra">
    <img class="logo" src="img/logo/kliskatek-white.svg" alt="Kliskatek" draggable="false">
    <!-- los de Kliskatek que ya han entrado en la historia: un sitio para cada uno, que se llena cuando aparece -->
    <div id="escena" class="escena"><span class="escena-tit"></span><div class="escena-sitios"></div></div>
    <div class="barra-der">
      <button id="pausa" class="redondo" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-pausa" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/><path class="i-play" d="M8 5l11 7-11 7z"/></svg></button>
      <button id="pantalla" class="redondo" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <div class="idiomas" role="group" aria-label="Language">
        <button data-idioma="en"><img src="img/iconos/gb.svg" alt=""><span>EN</span></button>
        <button data-idioma="es"><img src="img/iconos/es.svg" alt=""><span>ES</span></button>
        <button data-idioma="eu"><img src="img/iconos/eu.svg" alt=""><span>EU</span></button>
        <button data-idioma="zh"><img src="img/iconos/cn.svg" alt=""><span>中文</span></button>
      </div>
    </div>
  </header>

  <section id="diapos" class="diapos" aria-live="polite"></section>
  <button id="anterior" class="flecha-nav izq" aria-label="Previous">‹</button>
  <button id="siguiente" class="flecha-nav der" aria-label="Next">›</button>

  <!-- la línea del tiempo: el año de cada diapositiva y lo que hacía Ibon entonces -->
  <footer class="tiempo">
    <div class="eje"><div id="recorrido" class="recorrido"></div><div id="marcas" class="marcas"></div>
      <div id="cursor" class="cursor"><b id="cursor-anio"></b><span id="cursor-rol"></span></div></div>
  </footer>
</main>

<div id="girar" class="girar"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="32" rx="3"/><path d="M38 30a14 14 0 0 1-10 12m0 0l1-5m-1 5l5 1"/></svg><span></span></div>
